name = "nowakowska1982"
version = "0.1.0"
keywords = ["action-theory", "nowakowska", "lean4"]
defaultTargets = ["Actions"]

# `lake build` elaborates the root module Actions.lean, which must import
# every file under Actions/ (the single barrel). Module system matches
# DomainTheory / Palomar packaging.

moreLeanArgs = [
  "-Dbackward.privateInPublic=true",
  "-Dbackward.privateInPublic.warn=false",
]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "Actions"
globs = ["Actions"]
