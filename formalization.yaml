# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# nowakowska1982 — Palomar packaging (PALOMAR-2026-11-15-000006, version 1).
version: v0.4
project:
  name: Nowakowska Theory of Actions (1982) in Lean 4
  description: >-
    A Lean 4 / Mathlib (v4.36.0-rc2) formalization of Maria Nowakowska's
    A Formal Theory of Actions (Syntax and Semantics of Behaviour; chapter
    dated 1982; Praxiological Studies, 1983), synthesizing the parts of
    Language of Motivation and Language of Actions (1973) that 1982 cites
    for omitted proofs and for the motivational calculus (here: §§2.1.4,
    2.2.4, 5.1–5.3). Framing: rigorous reconstruction/verification of her
    action–motivation–promise material (precision gaps closed in Lean), plus
    a formalization contribution proving CF ∩ Regular so Promise/Offense CF
    theorems are unconditional. Headline compared claims include
    card_conflictFamilies (her stated 113), Attainable_iff_reaches_length
    (reachability realization), arrow_impossibility in the finite 2×3
    encoding, unconditional PromiseClosed/OffenseClosed.isContextFree with
    factor-minimal HatU, Language.IsContextFree.inter_regular, and
    stringDuration_pi / timed ψ-membership. Clinical Arrow abbrevs and MotCalc
    samples are supporting packaging, not claimed novelty. Maria Nowakowska
    did not participate in or endorse this formalization. Lean was written
    with AI-agent assistance under Lars Warren Ericson's direction and
    review. There is no sorry in the Actions/ development, no
    project-defined axiom, and Mathlib is the only Lake dependency.
    Palomar Registration: PALOMAR-2026-11-15-000006, version 1
    (https://palomar-registry.org/entry?id=PALOMAR-2026-11-15-000006&version=1).
  authors:
  - Lars Warren Ericson
  license: Apache-2.0
  responsible_maintainers:
  - Lars Warren Ericson
repository:
  role: substantive-development
classification:
  arxiv:
  - math.LO
  - cs.LO
  msc2020:
  - '03B70'
  - '68Q45'
  - '91B14'
  - '68V20'
