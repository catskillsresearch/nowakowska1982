    Complete for the Comparator family in comparator.json: all theorems-only
    dependency-graph sinks (no successor, including isolates), plus
    toActionSystem.L, and three clinical definition abbreviations.
    Intermediate theorems that still have successors remain library-only.
    Promise/offense CF theorems take RegularImpliesCF and CFInterRegular as
    explicit hypotheses.
