# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# nowakowska1982 — Palomar scaffolding (PALOMAR_URL still TBD).
version: v0.4
project:
  name: Nowakowska Theory of Actions (1982) in Lean 4
  description: >-
    Lean 4 / Mathlib (v4.36.0-rc2) formalization of Maria Nowakowska's
    A Formal Theory of Actions (1982/1983), with MotCalc and promise-CF
    proofs from Language of Motivation (1973). Compared claims:
    (i) novel machine-checked count of 113 labeled four-motive conflict
    patterns; (ii) novel automaton-to-sixtuplet realization theorem;
    (iii) Arrow dictatorial-core inconsistency with clinical corollary
    packaging; (iv) MotCalc sampled SemImp validity on the §2.2.4 epistemic
    model; (v) novel machine-checked promise/offense CF reconstructions
    from 1973 §5.3.2–5.3.3 (Ch. 3 closures as named hypotheses).
    Palomar Registration: TBD.
  authors:
  - Lars Warren Ericson
  license: Apache-2.0
  responsible_maintainers:
  - Lars Warren Ericson
repository:
  role: substantive-development
classification:
  arxiv:
  - math.LO
  - cs.LO
  msc2020:
  - 03B70
  - 68Q45
  - 91B14
status:
  scope: >-
    §§2,4–7,13 with MotCalc sample and promise CF reconstructions from
    scanned 1973 ranges (§§2.1.4, 2.2.4, 5.3).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Classical.choice
  - Quot.sound
  main_results:
  - declaration: Actions.Conflicts.conflictPattern_card
    file: Actions/Attainability/Conflicts.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
    literature_dependencies: []
    note: >-
      Novel compared claim: paper asserts 113 conflict types without exhibiting
      the enumeration; decide proof confirms the labeled downset model.
  - declaration: Actions.ActionAutomaton.toActionSystem.L
    file: Actions/Automata/ToActionSystem.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
    literature_dependencies: []
    note: >-
      Novel realization theorem: 1982 §13 states the automaton reading; this
      library supplies the machine-checked L-equality.
  - declaration: Actions.Arrow.ArrowPostulates2.impossibility_dictatorial_core
    file: Actions/Choice/Arrow.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
    literature_dependencies:
    - Arrow63
    note: >-
      Dictatorial-core inconsistency for pure scale dictators; clinical defs
      are disclosed library corollaries, not new psychological theorems.
  - declaration: Actions.MotCalc.SampledSemImp.epistemicModel
    file: Actions/Motivation/SampledSemImp.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
    literature_dependencies:
    - Nowakowska73a
    note: >-
      Sampled §2.1.4 SemImp rules validated on the §2.2.4 epistemic model;
      not a full 79-rule calculus.
  - declaration: Actions.ActionSystem.PromiseClosed.isContextFree
    file: Actions/Promise/PositiveCF.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
    literature_dependencies:
    - Nowakowska73a
    note: >-
      Novel machine-checked reconstruction of 1973 Thm 1 / 1982 §7 positive
      promise CF; RegularImpliesCF and CFInterRegular are explicit Ch. 3
      hypotheses (not yet in Mathlib).
  - declaration: Actions.ActionSystem.OffenseClosed.isContextFree
    file: Actions/Promise/OffenseCF.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
    literature_dependencies:
    - Nowakowska73a
    note: >-
      Novel machine-checked reconstruction of 1973 Thm 4 / 1982 §7 negative
      offense CF; same Ch. 3 closure hypotheses.
comparator_config: comparator.json
