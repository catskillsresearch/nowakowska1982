# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# nowakowska1982 — Palomar packaging (registration ID pending).
version: v0.4
project:
  name: Nowakowska Theory of Actions (1982) in Lean 4
  description: >-
    A Lean 4 / Mathlib (v4.36.0-rc2) formalization of Maria Nowakowska's
    A Formal Theory of Actions: Syntax and Semantics of Behaviour (chapter
    dated 1982; Praxiological Studies, 1983), synthesizing the parts of
    Language of Motivation and Language of Actions (1973) that 1982 cites
    for omitted proofs and for the motivational calculus (here: §§2.1.4,
    2.2.4, 5.1–5.3). The library covers the action-system sixtuplet, weak
    and strong attainability, Prax / Prax-min, a sampled MotCalc
    speaker-world model, verbal embedding with motivational consistency /
    satisfiability / ψ(A), promise closure, an automaton reading of the
    sixtuplet, and Arrow-style choice with clinical corollary packaging,
    with a small checked example. Compared Palomar claims are every theorem
    that is a sink in the theorems-only dependency graph (no successor,
    including isolates), plus toActionSystem.L and three clinical Arrow
    abbrevs — among them: (i) novel machine-checked count of 113 labeled
    four-motive conflict patterns; (ii) novel automaton-to-sixtuplet
    realization theorem; (iii) Arrow dictatorial-core inconsistency with
    clinical corollary packaging; (iv) MotCalc sampled SemImp validity on
    the §2.2.4 epistemic model; (v)–(vi) novel machine-checked
    promise/offense CF reconstructions from 1973 §5.3.2–5.3.3 (classical
    Ch. 3 CF∩regular closures as named hypotheses); plus Prax, verbal
    embedding / ψ, promise bridges, and toy-world sinks. Maria Nowakowska
    did not participate in or endorse this formalization. Lean was written
    with AI-agent assistance under Lars Warren Ericson's direction and
    review. There is no sorry in the Actions/ development, no
    project-defined axiom, and Mathlib is the only Lake dependency.
    Palomar Registration: TBD.
  authors:
  - Lars Warren Ericson
  license: Apache-2.0
  responsible_maintainers:
  - Lars Warren Ericson
repository:
  role: substantive-development
classification:
  arxiv:
  - math.LO
  - cs.LO
  msc2020:
  - '03B70'
  - '68Q45'
  - '91B14'
  - '68V20'
