    headline theorems (card_conflictFamilies, Attainable_iff_reaches_length,
    arrow_impossibility, unconditional Promise/Offense CF, inter_regular,
    stringDuration_pi) plus supporting sinks and three clinical definition
    abbreviations. Intermediate theorems that still have successors remain
    library-only. CF ∩ Regular is proved in Actions/Promise/CFInterRegular.lean.
