comparator_config: comparator.json

fidelity:
  divergences: >-
    Working sources: sources/nowakowska1982.pdf (1982/1983 chapter) and
    scanned 1973 ranges under sources/nowakowska_1973_*. OCR drafts
    (sources/*.md, *_vision.md) are navigation aids; Lean is authoritative.
    Discrete sentence duration φ_M : M → ℕ is a modeling simplification of
    the paper's real-valued φ on M. Utterance time is unified via
    utteranceTime(π pref) = floor(mixedDuration pref), with ConsistentWith
    tying k to the pause-block split. HatU is factor-minimal (first-offense
    infix reading); offense envelope is two-sided. Promise/offense CF theorems
    are unconditional: CF ∩ Regular is proved in-repo. Clinical Arrow readings
    are packaging of postulate failure, not new psychology. Exact narrative
    alignment lives in the Actions.md note tree / Actions.pdf.

sources:
  - title: "A Formal Theory of Actions: Syntax and Semantics of Behaviour"
    authors: ["Maria Nowakowska"]
    type: paper
    location: >-
      In W. Gasparski and T. Airaksinen (eds.), Praxiological Studies,
      PWN—Polish Scientific Publishers, Warszawa, 1983, pp. 143–177
      (chapter dated 1982). Working PDF: sources/nowakowska1982.pdf.
    relationship: formalizes
    note: >-
      Primary source. Nowakowska did not participate in or endorse this
      formalization.
  - title: "Language of Motivation and Language of Actions"
    authors: ["Maria Nowakowska"]
    type: book
    location: "Mouton, The Hague, 1973. §§2.1.4, 2.2.4, 5.1–5.3 used here."
    relationship: formalizes
    note: >-
      Source for MotCalc sample, verbal embedding, satisfiability / ψ, and
      promise/offense CF proofs that 1982 defers.
  - title: "Social Choice and Individual Values"
    authors: ["Kenneth J. Arrow"]
    type: book
    location: "Wiley, New York, 1963."
    relationship: background
    note: "Background for the §5 Arrow reading and clinical packaging."

related_formalizations: []

automation:
  methods:
  - method: agent
    models: ["Cursor Grok 4.7"]
    framework: Cursor
    role: >-
      Primary agent for Lean 4 / Mathlib formalization, lake build repair,
      vision-OCR transcription, narrative note tree, and Palomar packaging.
  - method: agent
    models: ["Cursor Composer 2.5"]
    framework: Cursor
    role: "Routine scaffolding and medium-complexity proof obligations."
  - method: agent
    models: ["Claude Fable 5.2"]
    framework: Cursor
    role: >-
      Substantive Lean repairs (automata realization, offense/HatU regularity,
      conflict-family cardinality, Arrow impossibility, CF ∩ Regular).
  - method: agent
    models: ["Google Gemini 3.8"]
    framework: Cursor
    role: "Exploratory and support passes."
  - method: manual
    models: []
    role: >-
      Lars Warren Ericson chose the formalization route and reviewed the
      Lean development. The human author takes responsibility for the
      report's mathematical claims.
  notes: >-
    Palomar Challenge / Solution / comparator / formalization.yaml packaging
    follows the scott1980 / scott1964 / cardb template. Registered as
    PALOMAR-2026-11-15-000006, version 1.

review:
  status: self-assessed
  reviewers:
  - Lars Warren Ericson
  notes: >-
    Lars Warren Ericson directed and reviewed the Lean development. This is
    not recorded as an independent external review. Every proof step is
    checked by the Lean kernel.

known_gaps:
  - >-
    MotCalc covers a sampled SemImp bundle on the §2.2.4 epistemic model,
    not the full published rule inventory.
  - >-
    Verbal-embedding sentence duration remains discrete (pause-units); full
    real-valued φ on M is not reconstructed in every lemma.

limitations:
  - >-
    No external mathematical review has been performed.
  - >-
    Source PDFs and OCR transcriptions are not Apache-2.0; see NOTICE.

alignment:
  namespace: Actions
  statements:
  - source: "§4 four-motive conflict count (113 types)"
    lean: Conflicts.card_conflictFamilies
    module: Actions.Conflicts
    status: proved
    note: "Verification of her stated 113 against IsConflictFamily."
  - source: "§13 automaton reading of the sixtuplet"
    lean: ActionAutomaton.toActionSystem.Attainable_iff_reaches_length
    module: Actions.ActionAutomaton
    status: proved
    note: "Reachability realization; L-equality is definitional infrastructure."
  - source: "§5 Arrow postulates"
    lean: Arrow.arrow_impossibility
    module: Actions.Arrow
    status: proved
    note: "Standard impossibility in this finite 2×3 encoding."
  - source: "1973 Thm 1 / 1982 §7 promise CF"
    lean: ActionSystem.PromiseClosed.isContextFree
    module: Actions.ActionSystem
    status: proved
    note: "Unconditional; uses proved CF ∩ Regular."
  - source: "1973 Thm 4 / 1982 §7 offense CF"
    lean: ActionSystem.OffenseClosed.isContextFree
    module: Actions.ActionSystem
    status: proved
    note: "Factor-minimal HatU; unconditional CF ∩ Regular."
  - source: "Classical CF ∩ Regular (Ch. 3 citation)"
    lean: Language.IsContextFree.inter_regular
    module: Language
    status: proved
    note: "Formalization contribution discharging her external citation."
  - source: "§5.2–5.3 duration / ψ coherence"
    lean: MixedSystem.pi.stringDuration_pi
    module: Actions.MixedSystem
    status: proved
    note: "Duration homomorphism; timed ConsistentWith / Psi."
